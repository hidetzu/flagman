# goreleaser v2. Archives for Linux, macOS and Windows; a checksum file. No Homebrew tap yet.
version: 2
project_name: flagman
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/flagman
    binary: flagman
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  use: github
  filters:
    exclude: ["^docs", "^test", "^chore"]
